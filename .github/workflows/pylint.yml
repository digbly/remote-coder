name: Pylint

on:
  pull_request:

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --extra dev
          uv pip install pylint
      - name: Analyse the code with pylint
        run: uv run pylint app tests
